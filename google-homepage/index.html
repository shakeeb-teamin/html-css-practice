<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Google</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Happy+Monkey&family=Orbitron:wght@400..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="container">
    <div class="header-container">
      <div class="header">
        <a href="#" target="_blank">Gmail</a>
        <a href="#" target="_blank">Images</a>
        <img class="icon" src="images/app.png" alt="Google App Icon" />
        <img
          class="icon"
          id="avatar"
          src="images/avatar.jpg"
          alt="Profile Avatar"
        />
      </div>
    </div>
    <div class="main">
      <img id="logo" src="images/logo.png" alt="Google Logo" />
      <div class="search">
        <div class="plus">
          <p>+</p>
        </div>
        <div class="search-opt">
          <img class="search-mic" src="images/mic.png" alt="Search by voice" />
          <img
            class="search-lense"
            src="images/lense.png"
            alt="Search by images"
          />
          <div class="ai-mode">
            <img class="ai-search" src="images/ai-srearch.png" alt="AI Mode Icon" />
            <p>AI Mode</p>
          </div>
        </div>
      </div>
      <div class="buttons">
        <button class="btn">Google Search</button>
        <button class="btn">I'm Feeling Lucky</button>
      </div>
    </div>
    <div class="footer">
      <div>
        <ul>
          <li><a href="#">About</a></li>
          <li><a href="#">Advertising</a></li>
          <li><a href="#">Business</a></li>
          <li><a href="#">How Search works</a></li>
        </ul>
      </div>
      <div class="right-foot">
        <ul>
          <li><a href="#">Privacy</a></li>
          <li><a href="#">Terms</a></li>
          <li><a href="#">Settings</a></li>
        </ul>
      </div>
    </div>
  </body>
</html>
